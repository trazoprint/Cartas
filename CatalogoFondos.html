<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de fondos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f3f58;
    --shadow:0 0 22px rgba(255,255,255,.9);
    --glass:rgba(255,255,255,.5);
    --line:rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0e0d10;
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{position:fixed;inset:0;transition:opacity .45s ease}
  .stage.fading{opacity:0}
  .bg{position:absolute;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #back{z-index:1}
  #front{z-index:3}

  .layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
  .layer.on{display:block}
  #cback{z-index:1}
  #cfront{z-index:3}
  .cloud{
    position:absolute;left:0;top:var(--top);
    width:var(--w);height:calc(var(--w) * var(--ratio));
    opacity:var(--op);
    animation:drift var(--dur) linear infinite;
    animation-delay:var(--delay);
    will-change:transform;
  }
  @keyframes drift{from{transform:translateX(-110%)}to{transform:translateX(calc(100vw + 10%))}}
  .cloud span{position:absolute;border-radius:50%}
  .cloud .body{inset:20% 6% 12% 6%;background:#fff}
  .cloud .shade{inset:48% 12% 6% 14%;background:rgba(120,150,180,.45);mix-blend-mode:multiply}
  .cloud .light{inset:10% 20% 42% 16%;background:#fff}

  .label{
    position:absolute;z-index:2;left:0;right:0;top:44%;
    transform:translateY(-50%);
    text-align:center;color:var(--ink);text-shadow:var(--shadow);
    padding:0 1.5rem;
  }
  .cat{
    display:block;font-size:.85rem;font-weight:500;
    letter-spacing:.28em;text-transform:uppercase;
    opacity:.85;margin-bottom:.9rem;
  }
  .name{
    font-weight:400;font-style:italic;
    font-size:clamp(3rem, 2rem + 6vw, 6rem);
    line-height:1.02;
  }
  .count{
    display:block;margin-top:1.1rem;font-size:1rem;
    letter-spacing:.12em;opacity:.75;font-variant-numeric:tabular-nums;
  }

  .controls{
    position:fixed;z-index:5;left:0;right:0;
    bottom:calc(1.6rem + env(safe-area-inset-bottom, 0px));
    display:flex;justify-content:center;gap:.8rem;padding:0 1rem;
  }
  .controls button{
    font:inherit;font-style:italic;font-size:1.15rem;
    color:var(--ink);
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:999px;
    padding:.6em 1.8em;cursor:pointer;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:color .45s ease, background .45s ease, border-color .45s ease;
  }
  .controls button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="cloud-filters"></defs></svg>

<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="layer" id="cback"></div>
  <canvas id="back"></canvas>
  <div class="label" aria-live="polite">
    <span class="cat" id="cat"></span>
    <h1 class="name" id="name"></h1>
    <span class="count" id="count"></span>
  </div>
  <canvas id="front"></canvas>
  <div class="layer" id="cfront"></div>
</div>

<nav class="controls">
  <button type="button" id="prev">Anterior</button>
  <button type="button" id="next">Siguiente</button>
</nav>

<script>
/* ================= Utilidades ================= */
const TAU = Math.PI * 2;
const R = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const lerp = (a, b, k) => a + (b - a) * k;
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const bc = document.getElementById('back'), fc = document.getElementById('front');
const bx = bc.getContext('2d'), fx = fc.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* Ruido para mármol y montañas */
const perm = new Uint8Array(512);
(() => { const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const X = xi & 255, Y = yi & 255;
  const h = (i, j) => perm[perm[(X + i) & 255] + ((Y + j) & 255)] / 255;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h(0,0), b = h(1,0), c = h(0,1), d = h(1,1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5){ let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < o; i++){ s += a * vnoise(x * f, y * f); n += a; f *= 2; a *= .5; } return s / n; }

/* Sprites de luz */
const spriteCache = {};
function glow(rgb){
  const key = 'g' + rgb;
  if (!spriteCache[key]){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.25, `rgba(${rgb},.55)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0,0,64,64); spriteCache[key] = c;
  }
  return spriteCache[key];
}
function disc(rgb){
  const key = 'd' + rgb;
  if (!spriteCache[key]){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0, `rgba(${rgb},.85)`); gr.addColorStop(.72, `rgba(${rgb},.7)`);
    gr.addColorStop(.88, `rgba(${rgb},.3)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0,0,128,128); spriteCache[key] = c;
  }
  return spriteCache[key];
}
const drawSprite = (ctx, img, x, y, r) => ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
function off(){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * DPR)); c.height = Math.max(1, Math.round(H * DPR));
  const g = c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); return [c, g];
}
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

/* Formas */
function heart(c, s){ c.beginPath(); c.moveTo(0,.35*s);
  c.bezierCurveTo(-.55*s,0,-.5*s,-.5*s,0,-.22*s); c.bezierCurveTo(.5*s,-.5*s,.55*s,0,0,.35*s); c.closePath(); }
function petal(c, s){ c.beginPath(); c.moveTo(0,-s);
  c.bezierCurveTo(.9*s,-.6*s,.7*s,.7*s,0,s); c.bezierCurveTo(-.7*s,.7*s,-.9*s,-.6*s,0,-s); c.closePath(); }
function leafShape(c, s){ c.beginPath(); c.moveTo(0,-s);
  c.quadraticCurveTo(.85*s,-.15*s,0,s); c.quadraticCurveTo(-.85*s,-.15*s,0,-s); c.closePath(); }
function star4(c, s){ c.beginPath(); c.moveTo(0,-s);
  c.quadraticCurveTo(0,0,s,0); c.quadraticCurveTo(0,0,0,s); c.quadraticCurveTo(0,0,-s,0); c.quadraticCurveTo(0,0,0,-s); c.closePath(); }

/* Partículas que caen (pétalos, hojas, confeti) */
function fallSpawn(p, init, o){
  p.front = Math.random() < o.front; const k = p.front ? o.fk : 1;
  p.s = R(o.s[0], o.s[1]) * k; p.x = R(-.05 * W, 1.05 * W); p.y = init ? R(-H * .1, H) : R(-60, -15);
  p.vy = R(o.vy[0], o.vy[1]) * (p.front ? 1.35 : 1); p.amp = R(10, o.amp); p.ph = R(0, TAU);
  p.fs = R(.6, 1.6); p.rot = R(0, TAU); p.vr = R(-1.6, 1.6); p.fl = R(1.5, 4);
  p.col = pick(o.cols); p.a = p.front ? o.fa : R(.7, 1);
}
function fallStep(p, dt, wind){
  p.y += p.vy * dt; p.ph += p.fs * dt; p.x += (Math.sin(p.ph) * p.amp + wind) * dt; p.rot += p.vr * dt;
  return p.y < H + 60 && p.x > -80 && p.x < W + 80;
}
function drawPetal(c, p, t){
  c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
  let sx = Math.cos(t * p.fl * .5 + p.ph); if (Math.abs(sx) < .12) sx = sx < 0 ? -.12 : .12;
  c.scale(sx, 1); c.globalAlpha = p.a; c.fillStyle = p.col; petal(c, p.s); c.fill();
  c.globalAlpha = p.a * .22; c.fillStyle = '#fff'; c.translate(-p.s * .15, -p.s * .25); c.scale(.5, .5); petal(c, p.s); c.fill();
  c.restore();
}

/* Elementos de decorado */
function bloom(g, x, y, k){
  const n = Math.round(6 * k + 2);
  for (let i = 0; i < n; i++){
    const cx = x + R(-16, 16) * k, cy = y + R(-13, 13) * k;
    g.globalAlpha = R(.75, 1); g.fillStyle = pick(['#f8bbd0','#f48fb1','#fce4ec','#f6a5c0','#ffffff']);
    g.beginPath(); g.arc(cx, cy, R(3, 7), 0, TAU); g.fill();
    g.globalAlpha = .9; g.fillStyle = '#d63a7a'; g.beginPath(); g.arc(cx, cy, 1, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
function branch(g, x, y, ang, len, w, d){
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  g.strokeStyle = '#4b2e2b'; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo((x + x2) / 2 + R(-12,12), (y + y2) / 2 + R(-12,12), x2, y2); g.stroke();
  if (d <= 0){ bloom(g, x2, y2, 1); return; }
  if (d < 3) bloom(g, x2, y2, .5);
  const n = d > 3 ? 2 : pick([2, 3]);
  for (let i = 0; i < n; i++) branch(g, x2, y2, ang + R(-.65, .65), len * R(.6, .78), w * .66, d - 1);
}
function forestLayer(g, col, base, tw){
  g.fillStyle = col; g.fillRect(0, base, W, H - base);
  let x = R(-30, 0);
  while (x < W + 40){
    const h = R(.7, 1.3) * tw, w = h * .42;
    for (let j = 0; j < 3; j++){
      const top = base - h + j * h * .28, wid = w * (.55 + j * .25);
      g.beginPath(); g.moveTo(x, top); g.lineTo(x + wid / 2, top + h * .45); g.lineTo(x - wid / 2, top + h * .45); g.closePath(); g.fill();
    }
    g.fillRect(x - w * .06, base - h * .2, w * .12, h * .25);
    x += R(.45, .85) * w;
  }
}
function sunflower(c, f, t){
  const sw = Math.sin(t * 1.1 + f.ph) * f.s * .18, hx = f.x + sw, hy = f.y;
  c.strokeStyle = '#4f7a2a'; c.lineWidth = Math.max(2, f.s * .14);
  c.beginPath(); c.moveTo(f.x, H + 5); c.quadraticCurveTo(f.x, hy + (H - hy) * .4, hx, hy); c.stroke();
  c.fillStyle = '#5b8a30'; c.save(); c.translate(f.x + sw * .4, hy + (H - hy) * .35); c.rotate(-.7);
  c.beginPath(); c.ellipse(f.s * .35, 0, f.s * .4, f.s * .15, 0, 0, TAU); c.fill(); c.restore();
  c.save(); c.translate(hx, hy);
  for (let L = 0; L < 2; L++){
    c.fillStyle = L ? '#f9d342' : '#e5a90b'; const n = 14;
    for (let i = 0; i < n; i++){
      c.save(); c.rotate(i / n * TAU + L * TAU / (2 * n));
      c.beginPath(); c.ellipse(0, -f.s * .62, f.s * .15, f.s * .36, 0, 0, TAU); c.fill(); c.restore();
    }
  }
  const g = c.createRadialGradient(0, 0, 0, 0, 0, f.s * .42);
  g.addColorStop(0, '#3b2210'); g.addColorStop(1, '#7a4b1c');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, f.s * .42, 0, TAU); c.fill(); c.restore();
}
function marble(){
  const k = 3, w = Math.ceil(W / k), h = Math.ceil(H / k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); const img = g.createImageData(w, h); const d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const nx = x * k / 420, ny = y * k / 420;
    const n = fbm(nx * 1.6, ny * 1.6, 5);
    const v = Math.abs(Math.sin((nx * 1.1 + ny * 2.2 + n * 4.2) * Math.PI));
    const vein = Math.pow(v, .25);
    const n2 = fbm(nx * 2.4 + 7, ny * 2.4 + 3, 4);
    const v2 = Math.abs(Math.sin((nx * 1.9 - ny * .7 + n2 * 5.5) * Math.PI));
    const gold = Math.max(0, 1 - v2 / .035) * .85;
    const sh = .94 + .06 * fbm(nx * 6, ny * 6, 3);
    let r = 247 * sh, gg = 245 * sh, b = 241 * sh;
    r = r * vein + 150 * (1 - vein); gg = gg * vein + 148 * (1 - vein); b = b * vein + 152 * (1 - vein);
    r = r * (1 - gold) + 205 * gold; gg = gg * (1 - gold) + 163 * gold; b = b * (1 - gold) + 80 * gold;
    const i = (y * w + x) * 4; d[i] = r; d[i+1] = gg; d[i+2] = b; d[i+3] = 255;
  }
  g.putImageData(img, 0, 0); return cv;
}
function waxSeal(g, x, y, r){
  g.save(); g.translate(x, y); g.fillStyle = '#8f1d1d'; g.beginPath();
  for (let i = 0; i <= 24; i++){ const a = i / 24 * TAU; const rr = r * (1 + .04 * Math.sin(a * 5) + R(-.02, .05)); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath(); g.fill();
  const gr = g.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
  gr.addColorStop(0, 'rgba(255,140,140,.35)'); gr.addColorStop(1, 'rgba(60,0,0,.35)'); g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(60,5,5,.55)'; g.lineWidth = r * .07; g.beginPath(); g.arc(0, 0, r * .68, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(70,5,5,.6)'; g.translate(0, r * .02); heart(g, r * .75); g.fill(); g.restore();
}
function cap(c, x, y, s, rot, t){
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = '#0d0d10'; c.beginPath(); c.moveTo(-s * .55, s * .05); c.lineTo(s * .55, s * .05);
  c.lineTo(s * .5, s * .48); c.quadraticCurveTo(0, s * .62, -s * .5, s * .48); c.closePath(); c.fill();
  c.fillStyle = '#1c1c22'; c.beginPath(); c.moveTo(-s, 0); c.lineTo(0, -s * .42); c.lineTo(s, 0); c.lineTo(0, s * .42); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.15)'; c.lineWidth = 1; c.stroke();
  c.strokeStyle = '#e0b84a'; c.lineWidth = Math.max(1.2, s * .05);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(s * .72, s * .08); c.lineTo(s * .72 + Math.sin(t * 4) * s * .05, s * .55); c.stroke();
  c.fillStyle = '#e0b84a'; c.fillRect(s * .66, s * .5, s * .12, s * .2);
  c.beginPath(); c.arc(0, 0, s * .07, 0, TAU); c.fill(); c.restore();
}

function star5(c, r){ c.beginPath(); for (let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); }
function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath(); }
function reindeer(c, x, y, t, i){
  const a = Math.sin(t * 9 + i * 1.3);
  c.lineWidth = 4; c.beginPath();
  c.moveTo(x + 14, y + 6); c.lineTo(x + 30 + a * 4, y + 20); c.moveTo(x + 10, y + 6); c.lineTo(x + 24 + a * 6, y + 22);
  c.moveTo(x - 16, y + 6); c.lineTo(x - 32 - a * 4, y + 16); c.moveTo(x - 12, y + 6); c.lineTo(x - 28 - a * 6, y + 20); c.stroke();
  c.beginPath(); c.ellipse(x, y, 24, 10, -.08, 0, TAU); c.fill();
  c.lineWidth = 7; c.beginPath(); c.moveTo(x + 16, y - 2); c.lineTo(x + 26, y - 16); c.stroke();
  c.beginPath(); c.ellipse(x + 32, y - 19, 9, 5, .3, 0, TAU); c.fill();
  c.lineWidth = 1.8; c.beginPath(); c.moveTo(x + 27, y - 22); c.lineTo(x + 22, y - 34); c.lineTo(x + 16, y - 38);
  c.moveTo(x + 23, y - 31); c.lineTo(x + 28, y - 38); c.moveTo(x + 29, y - 23); c.lineTo(x + 31, y - 34); c.stroke();
  c.lineWidth = 3; c.beginPath(); c.moveTo(x - 24, y - 3); c.lineTo(x - 30, y - 8); c.stroke();
}
function santa(c, x, y, k, t){
  c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = '#0a0f22'; c.strokeStyle = '#0a0f22'; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-60, -10); c.quadraticCurveTo(-62, -34, -44, -36); c.lineTo(-38, -22); c.lineTo(20, -22);
  c.quadraticCurveTo(34, -22, 36, -36); c.lineTo(40, -34); c.quadraticCurveTo(40, -4, 14, 0); c.lineTo(-50, 0); c.closePath(); c.fill();
  c.lineWidth = 3; c.beginPath(); c.moveTo(-58, 10); c.lineTo(30, 10); c.quadraticCurveTo(46, 10, 44, -2); c.stroke();
  c.beginPath(); c.moveTo(-40, 0); c.lineTo(-40, 10); c.moveTo(10, 0); c.lineTo(10, 10); c.stroke();
  c.beginPath(); c.ellipse(-38, -38, 14, 16, -.3, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(-8, -34, 13, 15, 0, 0, TAU); c.fill();
  c.beginPath(); c.arc(-4, -54, 8, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-12, -58); c.quadraticCurveTo(-6, -74, -20, -72); c.lineTo(4, -58); c.closePath(); c.fill();
  c.beginPath(); c.arc(-21, -72, 3, 0, TAU); c.fill();
  c.lineWidth = 5; c.beginPath(); c.moveTo(-2, -40); c.lineTo(12, -36); c.stroke();
  let px = 12, py = -36;
  for (let i = 0; i < 4; i++){
    const rx = 95 + i * 80, ry = -38 - i * 6 + Math.sin(t * 6 + i) * 3;
    c.lineWidth = 1.2; c.beginPath(); c.moveTo(px, py); c.lineTo(rx - 20, ry - 2); c.stroke();
    reindeer(c, rx, ry, t, i); px = rx + 28; py = ry - 8;
  }
  c.restore();
}
function hero(c, x, y, s, t, dir){
  c.save(); c.translate(x, y); c.scale(dir, 1);
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5;
  for (let i = 0; i < 4; i++){ const yy = (i - 1.5) * s * .12; c.beginPath(); c.moveTo(-s * 1.2 - i * s * .15, yy); c.lineTo(-s * 2 - i * s * .3, yy); c.stroke(); }
  const w = Math.sin(t * 10) * s * .08, w2 = Math.sin(t * 10 + 1.3) * s * .1;
  c.fillStyle = '#d62839'; c.beginPath(); c.moveTo(s * .35, -s * .12); c.quadraticCurveTo(-s * .2, -s * .25 + w, -s * 1.05, -s * .18 + w2);
  c.quadraticCurveTo(-s * .6, -s * .02 + w, -s * .95, s * .1 + w2); c.quadraticCurveTo(-s * .2, s * .05, s * .3, -s * .02); c.closePath(); c.fill();
  c.fillStyle = '#2d2a4a'; c.beginPath(); c.ellipse(s * .12, 0, s * .33, s * .11, 0, 0, TAU); c.fill();

        const w = R(40, 110) * (sm / 800 + .5), h = H * R(h0, h1), top = H - h;
        g.fillStyle = col; g.fillRect(x, top, w, h);
        if (Math.random() < .3) g.fillRect(x + w * .45, top - h * .12, 2, h * .12);
        for (let wy = top + 8; wy < H - 8; wy += 16) for (let wx = x + 6; wx < x + w - 8; wx += 12){
          if (Math.random() < lit * .6){ g.fillStyle = `rgba(255,214,120,${R(.35, .85) * lit * 1.4})`; g.fillRect(wx, wy, 5, 7); }
        }
        x += w + R(2, 10);
      }
    });
    s.cache = cv; s.next = 2; s.fly = null; s.lights = [W * .25, W * .75];
  },
  decor(c, t){
    const s = this.state; c.globalCompositeOperation = 'lighter';
    s.lights.forEach((lx, i) => {
      const a = -Math.PI / 2 + Math.sin(t * .4 + i * 2.1) * .5, L = H * 1.3;
      const g = c.createLinearGradient(lx, H, lx + Math.cos(a) * L, H + Math.sin(a) * L);
      g.addColorStop(0, 'rgba(200,220,255,.35)'); g.addColorStop(1, 'rgba(200,220,255,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(lx - 6, H); c.lineTo(lx + Math.cos(a - .07) * L, H + Math.sin(a - .07) * L); c.lineTo(lx + Math.cos(a + .07) * L, H + Math.sin(a + .07) * L); c.lineTo(lx + 6, H); c.closePath(); c.fill();
    });
    c.globalCompositeOperation = 'source-over';
    if (!s.fly && t > s.next) s.fly = { t0:t, dur:4.5, y:H * R(.15, .4), dir:Math.random() < .5 ? 1 : -1 };
    if (s.fly){
      const k = (t - s.fly.t0) / s.fly.dur;
      if (k > 1){ s.fly = null; s.next = t + R(3, 6); }
      else { const sz = Math.min(W, H) * .09, x = s.fly.dir > 0 ? lerp(-sz * 2, W + sz * 2, k) : lerp(W + sz * 2, -sz * 2, k); hero(c, x, s.fly.y - Math.sin(k * Math.PI) * H * .05, sz, t, s.fly.dir); }
    }
    c.drawImage(s.cache, 0, 0, W, H);
  },
  spawn(p){ p.front = false; p.x = R(0, W); p.y = R(0, H * .6); p.r = Math.pow(Math.random(), 3) * 1.6 + .4; p.ph = R(0, TAU); p.sp = R(.5, 2); },
  step(){ return true; },
  draw(c, p, t){ c.globalAlpha = .3 + .6 * (.5 + .5 * Math.sin(t * p.sp + p.ph)); c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x, p.y, p.r * .7, 0, TAU); c.fill(); }
}

];

/* ================= Nubes realistas (escenario 1) ================= */
(function buildClouds(){
  const defs = document.getElementById('cloud-filters'); const seeds = [3, 11, 27, 48]; let html = '';
  seeds.forEach((s, i) => {
    html += `<filter id="fa${i}" x="-60%" y="-60%" width="220%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="5" seed="${s}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="3"/></filter>
    <filter id="fb${i}" x="-60%" y="-60%" width="220%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="${s + 5}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="110" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="12"/></filter>
    <filter id="fc${i}" x="-60%" y="-60%" width="220%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="${s + 9}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="7"/></filter>`;
  });
  defs.innerHTML = html;
  const small = window.innerWidth < 700;
  function make(layer, o){
    const c = document.createElement('div'); c.className = 'cloud'; const dur = R(o.d[0], o.d[1]), f = (Math.random() * 4) | 0;
    c.style.setProperty('--w', R(o.w[0], o.w[1]).toFixed(0) + 'px'); c.style.setProperty('--ratio', R(.32, .48).toFixed(2));
    c.style.setProperty('--top', R(o.t[0], o.t[1]).toFixed(1) + 'vh'); c.style.setProperty('--dur', dur.toFixed(1) + 's');
    c.style.setProperty('--delay', (-Math.random() * dur).toFixed(1) + 's'); c.style.setProperty('--op', R(o.o[0], o.o[1]).toFixed(2));
    c.innerHTML = `<span class="body" style="filter:url(#fa${f})"></span><span class="shade" style="filter:url(#fb${f})"></span><span class="light" style="filter:url(#fc${f})"></span>`;
    layer.appendChild(c);
  }
  const back = document.getElementById('cback'), front = document.getElementById('cfront');
  for (let i = 0; i < (small ? 3 : 5); i++) make(back, { w:small ? [140,240] : [200,340], t:[-4,55], d:[150,220], o:[.55,.8] });
  for (let i = 0; i < (small ? 4 : 6); i++) make(back, { w:small ? [240,420] : [380,700], t:[0,80], d:[90,140], o:[.85,1] });
  for (let i = 0; i < (small ? 2 : 3); i++) make(front, { w:small ? [300,520] : [560,950], t:[5,85], d:[60,95], o:[.32,.55] });
})();

/* ================= Motor ================= */
const stage = document.getElementById('stage'), bgEl = document.getElementById('bg'), root = document.documentElement;
const catEl = document.getElementById('cat'), nameEl = document.getElementById('name'), countEl = document.getElementById('count');
const cback = document.getElementById('cback'), cfront = document.getElementById('cfront');
let cur = 0, sc = null, parts = [], last = performance.now(), T = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
  for (const [cv, ctx] of [[bc, bx], [fc, fx]]){ cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
}

function enter(i){
  cur = (i + S.length) % S.length; sc = S[cur]; sc.state = {};
  bgEl.style.background = sc.bg;
  root.style.setProperty('--ink', sc.ink);
  root.style.setProperty('--shadow', sc.dark ? '0 2px 24px rgba(0,0,0,.55)' : '0 0 22px rgba(255,255,255,.9), 0 0 4px rgba(255,255,255,.7)');
  root.style.setProperty('--glass', sc.dark ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.55)');
  root.style.setProperty('--line', sc.dark ? 'rgba(255,255,255,.3)' : 'rgba(0,0,0,.18)');
  catEl.textContent = sc.cat; nameEl.textContent = sc.name; countEl.textContent = `${cur + 1} / ${S.length}`;
  cback.classList.toggle('on', !!sc.clouds); cfront.classList.toggle('on', !!sc.clouds);
  if (sc.setup) sc.setup();
  parts = [];
  const area = Math.min(1.5, Math.max(.5, W * H / (1280 * 800)));
  const n = Math.round((sc.count || 0) * area);
  for (let k = 0; k < n; k++){ const p = {}; sc.spawn(p, true); parts.push(p); }
}

function frame(now){
  let dt = Math.min(.05, (now - last) / 1000); last = now; if (RM) dt *= .3; T += dt;
  bx.clearRect(0, 0, W, H); fx.clearRect(0, 0, W, H);
  if (sc.decor) sc.decor(bx, T, dt);
  if (sc.add){ bx.globalCompositeOperation = 'lighter'; fx.globalCompositeOperation = 'lighter'; }
  for (const p of parts){
    if (!sc.step(p, dt, T)) sc.spawn(p, false);
    const c = p.front ? fx : bx; c.globalAlpha = 1; sc.draw(c, p, T);
  }
  bx.globalCompositeOperation = 'source-over'; fx.globalCompositeOperation = 'source-over';
  bx.globalAlpha = 1; fx.globalAlpha = 1;
  if (sc.decorFront) sc.decorFront(fx, T, dt);
  requestAnimationFrame(frame);
}

let busy = false;
function go(d){
  if (busy) return; busy = true; stage.classList.add('fading');
  setTimeout(() => { enter(cur + d); stage.classList.remove('fading'); setTimeout(() => { busy = false; }, 450); }, 450);
}
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, { passive:true });

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); enter(cur); }, 150); });

resize(); enter(0); requestAnimationFrame(frame);
</script>
